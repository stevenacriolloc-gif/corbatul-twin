services:
  - type: web
    name: corbatul-twin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m corbatul.server --host 0.0.0.0 --port $PORT --quiet
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
